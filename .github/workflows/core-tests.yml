name: Core physics and inference contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/test-core.txt
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements/test-core.txt
      - name: Test physics, candidate selection, probing and input isolation
        run: >-
          python -m pytest -q
          tests/test_cohesive.py
          tests/test_cohesive_inference.py
          tests/test_budgeted_direct.py
          tests/test_joint_state.py
          tests/test_hypothesis_selection.py
          tests/test_active_probe.py
          tests/test_fixture_reference.py
          tests/test_response_diversity_io.py
          tests/test_compliant_fixture.py
          tests/test_compliant_inference.py
          tests/test_measurement_bias.py
          tests/test_damage_guard.py
          tests/test_action_ceiling.py
          tests/test_continuous_risk.py
          tests/test_verified_policy.py
          tests/test_risk_reuse.py
          tests/test_observation_budget.py
          tests/test_response_quadrature.py
          tests/test_response_quadrature_io.py
          tests/test_guided_quadrature.py
          tests/test_task_design.py
          tests/test_alternating_frontier.py
          tests/test_probe_identifiability.py
          tests/test_spatial_fixture.py
          tests/test_spatial_observation.py
          tests/test_continuous_risk_evaluation.py
          tests/test_camera_measurement.py
      - name: Replay published identifiability proof evidence
        env:
          PYTHONPATH: .
        run: python scripts/probe_identifiability_evaluate.py --replay-proofs docs/results/probe-identifiability-proofs.json
      - name: Replay spatial decisions without truth labels
        env:
          PYTHONPATH: .
        run: python scripts/spatial_policy_replay.py
